    sha256_16: 4ad0c027d1bcdce8
    role: evaluation
    nature: vecteur
    bet: "même BET que type 2"
    verite_terrain: null
    note: "Même bureau d'études que le plan de calibrage : utile pour la robustesse, faible pour la généralisation."

  - id: extension_archive
