# Corpus de plans BA réels pour mesurer la généralisation (C1 / C5).
#
# Les PDF ne sont PAS versionnés (documents clients). Ils sont cherchés dans
# le dossier PLANBA_CORPUS_DIR (par défaut : %USERPROFILE%\Downloads).
# sha256_16 = 16 premiers caractères du SHA-256 : garantit que le benchmark
# tourne sur le bon fichier.
#
# role :
#   calibrage  -> plan sur lequel le code a été réglé. Ses scores ne
#                 prouvent RIEN sur la généralisation.
#   evaluation -> plan jamais utilisé pour régler le code. Seuls ces scores
#                 comptent pour décider si une modification est acceptée.
#
# verite_terrain : JSON dans corpus/verite_terrain/. Utilisé seulement si
# son champ "statut" vaut "valide" (relu par l'ingénieur).

plans:
  - id: str_eljadida_type2
    fichier: "STR-SALLE DE CLASSE ELJADIDA-SIDI BANOUR-TYPE 2-09-05-2025-A0.pdf"
    sha256_16: b0efd4e9986f27e1
    role: calibrage
    nature: vecteur
    bet: "BET (cartouche STR, El Jadida)"
    verite_terrain: null
    note: "Plan de réglage de bdf7437. Aucun métré manuel disponible."

  - id: str_eljadida_type4
